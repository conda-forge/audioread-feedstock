schema_version: 1

context:
  version: "3.1.0"

package:
  name: audioread
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/audioread/audioread-${{ version }}.tar.gz
  sha256: 1c4ab2f2972764c896a8ac61ac53e261c8d29f0c6ccd652f84e18f08a4cab190

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }}
    - ffmpeg
    - standard-aifc
    - standard-sunau

tests:
  - python:
      imports:
        - audioread
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Multi-library, cross-platform audio decoding.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/beetbox/audioread

extra:
  recipe-maintainers:
    - bmcfee
    - sampsyo
    - scopatz
    - mfansler
    - mgorny
