schema_version: 1

context:
  version: "3.1.0"

package:
  name: audioread
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/audioread/audioread-${{ version }}.tar.gz
  sha256: 1c4ab2f2972764c896a8ac61ac53e261c8d29f0c6ccd652f84e18f08a4cab190

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - poetry-core
    - pip
  run:
    - python
    - if: not win
      then: ffmpeg
    - if: match(python, ">=3.13")
      then:
        - standard-aifc
        - standard-sunau

tests:
  - python:
      imports:
        - audioread
      pip_check: false

about:
  license: MIT
  license_file: LICENSE
  summary: multi-library, cross-platform audio decoding
  homepage: https://github.com/beetbox/audioread

extra:
  recipe-maintainers:
    - bmcfee
    - sampsyo
    - scopatz
    - mfansler
